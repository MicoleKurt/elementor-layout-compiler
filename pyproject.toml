[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elementor-layout-compiler"
version = "0.1.0"
description = "Compile a validated layout manifest and locked design tokens into Elementor container JSON (_elementor_data)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Micole Kurt T. Gonda", email = "ico.webdev@gmail.com" }]
keywords = ["elementor", "wordpress", "json-schema", "design-tokens", "code-generation"]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
elc = "elementor_layout_compiler.cli:main"

[project.urls]
Homepage = "https://github.com/MicoleKurt/elementor-layout-compiler"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elementor_layout_compiler = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
